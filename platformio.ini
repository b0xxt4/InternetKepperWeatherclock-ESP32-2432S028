[platformio]
default_envs = cyd2usb

[env:cyd2usb]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino

; ESP32-2432S028 Doppel-USB/CYD2USB: klassischer ESP32-WROOM-32 ohne PSRAM.
board_build.partitions = min_spiffs.csv
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@6.21.5

build_flags =
    -Wall
    -Wextra
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; 40 MHz ist für die langsam aktualisierte Wetteroberfläche mehr als
    ; schnell genug und toleranter gegenüber CYD-Klonen als 55 MHz.
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
